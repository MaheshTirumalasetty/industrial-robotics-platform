name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: ruff check api tests

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -f docker/api.Dockerfile \
            -t ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }} \
            .

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint helm/manufacturing-api

      - name: Helm Template
        run: helm template manufacturing-api helm/manufacturing-api

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Azure Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS with Helm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          helm upgrade --install manufacturing-api ./helm/manufacturing-api \
            --namespace industrial-robotics \
            --create-namespace \
            --set image.repository=ghcr.io/${{ steps.image.outputs.name }} \
            --set-string image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m