stages:
  - validate
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

lint:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install -r requirements-dev.txt
    - ruff check api tests

unit-test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements-dev.txt
    - pytest -q

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -f docker/api.Dockerfile -t manufacturing-api:$CI_COMMIT_SHORT_SHA .
