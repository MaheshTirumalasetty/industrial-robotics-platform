apiVersion: apps/v1
kind: Deployment
metadata:
  name: manufacturing-api
  namespace: industrial-robotics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: manufacturing-api
  template:
    metadata:
      labels:
        app: manufacturing-api
    spec:
      containers:
        - name: manufacturing-api
          image: manufacturing-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: manufacturing-api-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
